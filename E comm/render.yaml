services:
  - type: web
    name: vastra-e-comm-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://vastra-e-comm.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
